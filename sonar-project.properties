# Configurare analiză SonarQube — rulează din agri-api cu: make sonar-front
sonar.projectKey=agri-front
sonar.projectName=Agri Front
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.exclusions=**/*.d.ts,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,src/test/**
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,src/test/**

# Coverage generat de `npm run test:coverage` (sonar-front din agri-api îl rulează automat)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Nu intră în procentul de coverage: paginile, layout-urile și bootstrap-ul aplicației (UI pur cu
# MUI, hărți și grafice). Se măsoară logica: api/, hooks/, schemas/, store/, utils/, components/, routes.
# Lista e oglindită în vite.config.ts (test.coverage.exclude).
sonar.coverage.exclusions=src/pages/**,src/layouts/**,src/routes/AppRoutes.tsx,src/routes/components/**,src/main.tsx,src/App.tsx,src/theme.ts,src/assets/**,**/*.d.ts,**/*.types.ts

# Excepții verificate manual (în config, nu în UI, ca să se aplice la toți cei care rulează analiza local)
# e1: Math.random() poziționează doar particulele decorative de pe ecranul de login — nu e folosit în scop de securitate.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.e1.resourceKey=src/pages/auth/AuthLayout.tsx
