# Configurare analiză SonarQube — rulează din agri-api cu: make sonar-front
sonar.projectKey=agri-front
sonar.projectName=Agri Front
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.exclusions=**/*.d.ts,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Excepții verificate manual (în config, nu în UI, ca să se aplice la toți cei care rulează analiza local)
# e1: Math.random() poziționează doar particulele decorative de pe ecranul de login — nu e folosit în scop de securitate.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.e1.resourceKey=src/pages/auth/AuthLayout.tsx
